name: 🚀 Build & Deploy Closer (Atômico)

on:
  push:
    branches: [main] # Dispara o deploy automaticamente ao enviar código para a branch main

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, zip, pgsql, pdo_sqlite
          coverage: none

      - name: 📦 Install Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build Assets (Vite/TS)
        run: |
          npm install
          npm run build # Essencial para evitar erros de JS/Vue no navegador

      - name: 🤐 Criar Pacote de Deploy
        run: zip -r deploy.zip . -x ".git/*" "node_modules/*" ".github/*" "tests/*" ".env*" "storage/*"

      - name: 🔑 Configure SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: 🚀 Deploy Atômico
        run: |
          PROJECT_NAME="closer"
          scp deploy.zip ubuntu@${{ secrets.SERVER_IP }}:/tmp/${PROJECT_NAME}-deploy.zip

          ssh ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
            set -e # Aborta o script em caso de erro

            # CONFIGURAÇÃO DE CAMINHOS
            PROJECT="closer"
            BASE_PATH="/var/www/$PROJECT"
            SHARED_PATH="${BASE_PATH}/shared"
            LIVE_LINK="${BASE_PATH}/current"
            RELEASES_PATH="${BASE_PATH}/releases"
            NEW_RELEASE="${RELEASES_PATH}/$(date +%Y%m%d%H%M%S)"
            
            # 1. GARANTIR ESTRUTURA PERSISTENTE (FOTOS E STORAGE)
            # Criamos a pasta 'fotos' no shared para as imagens não sumirem no deploy
            sudo mkdir -p ${SHARED_PATH}/storage/app/public/fotos
            sudo mkdir -p ${SHARED_PATH}/storage/framework/{cache,sessions,views}
            sudo mkdir -p ${SHARED_PATH}/storage/logs
            
            # 2. PREPARAR NOVA VERSÃO
            sudo mkdir -p ${NEW_RELEASE}
            sudo unzip -o /tmp/${PROJECT}-deploy.zip -d ${NEW_RELEASE}
            
            # 3. CONECTAR ARQUIVOS VIA LINKS SIMBÓLICOS
            sudo ln -sfn ${SHARED_PATH}/.env ${NEW_RELEASE}/.env
            sudo rm -rf ${NEW_RELEASE}/storage
            sudo ln -sfn ${SHARED_PATH}/storage ${NEW_RELEASE}/storage

            # 4. AJUSTAR PERMISSÕES (USUÁRIO NGINX)
            sudo chown -R www-data:www-data ${NEW_RELEASE}
            sudo chown -R www-data:www-data ${SHARED_PATH}/storage
            
            # 5. LINK DE ACESSO PÚBLICO (STORAGE LINK)
            # Garante que closer.hierarca.com/storage aponte para as fotos dos usuários
            sudo rm -rf ${NEW_RELEASE}/public/storage
            sudo ln -sfn ${SHARED_PATH}/storage/app/public ${NEW_RELEASE}/public/storage
            
            # 6. COMANDOS INTERNOS DO LARAVEL
            cd ${NEW_RELEASE}
            sudo -u www-data php artisan migrate --force
            sudo -u www-data php artisan optimize
            
            # NOTA: O comando sync-product-images foi removido por não existir neste projeto.
            
            # 7. SWAP ATÔMICO (VIRADA DA CHAVE)
            sudo ln -sfn ${NEW_RELEASE} ${LIVE_LINK}
            
            # 8. REINICIALIZAÇÃO E LIMPEZA
            sudo systemctl restart php8.4-fpm
            sudo rm /tmp/${PROJECT}-deploy.zip
            
            # Manter apenas as últimas 5 versões para economizar seu VRAM/Disco na Oracle Cloud
            cd ${RELEASES_PATH} && sudo ls -1tr | head -n -5 | xargs -d '\n' rm -rf --
            
            echo "✅ Deploy de '$PROJECT' finalizado com sucesso!"
          EOF